<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy:
      - default-src 'self'         → apenas recursos locais
      - script-src 'self'          → sem inline scripts
      - style-src 'self' 'unsafe-inline' fonts.googleapis.com → Tailwind inline + Google Fonts
      - font-src 'self' fonts.gstatic.com → arquivos .woff2 do Geist
      - connect-src 'self' https: http://127.0.0.1:3847 http://localhost:3847 → API local no modo navegador
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: http://127.0.0.1:3847 http://localhost:3847;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>gestec · help desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
